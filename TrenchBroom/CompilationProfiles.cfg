{
	"profiles": [
		{
			"name": "Compile + launch",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-export.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-export.map ${GAME_DIR_PATH}",
					"tool": "${mapc}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": false,
					"parameters": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-export.map ${GAME_DIR_PATH} --debug-paths",
					"tool": "${mapc}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-export.map",
					"type": "delete"
				},
				{
					"enabled": true,
					"source": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-export.sol",
					"target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}.sol",
					"type": "rename"
				},
				{
					"enabled": true,
					"source": "${WORK_DIR_PATH}/${MAP_BASE_NAME}.sol",
					"target": "${GAME_DIR_PATH}/tmp",
					"type": "copy"
				},
				{
					"enabled": true,
					"engineProfileId": "115e34bf-65c7-4487-910b-60f86ac57b1b",
					"treatLaunchFailureAsError": true,
					"type": "launchEngine"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		}
	],
	"version": 1
}
