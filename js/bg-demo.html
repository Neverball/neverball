<!DOCTYPE html>
<!-- Generated by agy 1.4.12 (Gemini 3.8 Flash (High)) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neverball Dynamic Background Demo</title>

  <!-- Preload key data in parallel for optimal TTFP -->
  <link rel="preload" href="data/geom/back/back.sol" as="fetch" crossorigin>
  <link rel="preload" href="data/back/land.png" as="fetch" crossorigin>
  <link rel="preload" href="data/map-back/clouds.sol" as="fetch" crossorigin>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color-scheme: dark;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
      pointer-events: auto;
    }

    .ui-container {
      position: relative;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 1.5rem;
    }

    .panel {
      pointer-events: auto;
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      max-width: 420px;
    }

    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.4rem;

      color: #58a6ff;
    }

    p {
      margin: 0 0 1rem 0;

      color: #8b949e;
      line-height: 1.4;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }

    .control-row label {
      font-weight: 500;
      color: #c9d1d9;
    }

    select, button, input[type="range"] {
      font-family: inherit;
      font-size: 0.85rem;
      background: #21262d;
      color: #f0f6fc;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
    }

    select:focus, button:focus {
      outline: 2px solid #58a6ff;
    }

      background: #30363d;
    }

    .badge-bar {
      display: flex;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-family: monospace;
      color: #7ee787;
      margin-top: 0.5rem;
    }

    .badge {
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.4);

      border-radius: 4px;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="ui-container">
    <div class="panel">
      <h1>Neverball Dynamic Background</h1>
      <p>Rendered on WebGL via Neverball's native background renderer with zero game overhead.</p>

      <div class="control-row">
        <label for="preset-select">Background Preset</label>
        <select id="preset-select">
          <option value="clouds" selected>Clouds (Sunny Day)</option>
          <option value="city">City (Night Sky)</option>
          <option value="ocean">Ocean (Open Sea)</option>
          <option value="jupiter">Jupiter (Deep Space)</option>
          <option value="alien">Alien (Exoplanet)</option>
          <option value="volcano">Volcano (Inferno)</option>
        </select>
      </div>

      <div class="control-row">
        <label for="speed-range">Drift Speed</label>
        <input type="range" id="speed-range" min="0" max="0.2" step="0.01" value="0.01">
      </div>

      <div class="control-row">
        <label for="fov-range">Field of View</label>
        <input type="range" id="fov-range" min="30" max="110" step="1" value="40">
      </div>

      <div class="control-row">
        <label>Controls</label>
        <button id="toggle-btn">Pause</button>
      </div>

      <div class="badge-bar">
        <span class="badge" id="ttfp-badge">TTFP: measuring...</span>
        <span class="badge" id="status-badge">Ready</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { NeverballBg } from './neverball-bg.js';

    const canvas = document.getElementById('bg-canvas');
    const presetSelect = document.getElementById('preset-select');
    const speedRange = document.getElementById('speed-range');
    const fovRange = document.getElementById('fov-range');
    const toggleBtn = document.getElementById('toggle-btn');
    const ttfpBadge = document.getElementById('ttfp-badge');
    const statusBadge = document.getElementById('status-badge');

    const startTime = performance.now();
    let currentBg = null;
    let isPlaying = true;

    async function init() {
      try {
        statusBadge.textContent = 'Prefetching data...';

        // 1. Concurrently prefetch preset data files over HTTP/2 in parallel
        const dataPromise = NeverballBg.fetchBackground('clouds', { baseUrl: 'data' });

        // 2. Concurrently initialize canvas and mount engine
        statusBadge.textContent = 'Mounting canvas...';
        currentBg = await NeverballBg.mount(canvas, {
          data: dataPromise,
          preset: 'clouds',
          fov: parseFloat(fovRange.value),
          driftSpeed: parseFloat(speedRange.value),
          interactive: true,
          autostart: true,
        });
        window.currentBg = currentBg;

        const elapsed = Math.round(performance.now() - startTime);
        ttfpBadge.textContent = `TTFP: ${elapsed}ms`;
        statusBadge.textContent = 'Active (60 FPS)';
      } catch (err) {
        console.error(err);
        statusBadge.textContent = 'Error: ' + err.message;
        statusBadge.style.color = '#ff7b72';
      }
    }

    presetSelect.addEventListener('change', async (e) => {
      const preset = e.target.value;
      if (!currentBg) return;

      statusBadge.textContent = `Loading ${preset}...`;
      try {
        const newData = await NeverballBg.fetchBackground(preset, {
          baseUrl: 'data',
          includeSky: false // reuse already-loaded sky cylinder mesh
        });
        currentBg.load(newData, preset);
        statusBadge.textContent = `Active (${preset})`;
      } catch (err) {
        console.error(err);
        statusBadge.textContent = 'Load error: ' + err.message;
      }
    });

    speedRange.addEventListener('input', (e) => {
      if (currentBg) currentBg.setCamera({ speed: parseFloat(e.target.value) });
    });

    fovRange.addEventListener('input', (e) => {
      if (currentBg) currentBg.setCamera({ fov: parseFloat(e.target.value) });
    });

    toggleBtn.addEventListener('click', () => {
      if (!currentBg) return;
      if (isPlaying) {
        currentBg.pause();
        toggleBtn.textContent = 'Resume';
        statusBadge.textContent = 'Paused';
        isPlaying = false;
      } else {
        currentBg.resume();
        toggleBtn.textContent = 'Pause';
        statusBadge.textContent = 'Active';
        isPlaying = true;
      }
    });

    init();
  </script>
</body>
</html>
