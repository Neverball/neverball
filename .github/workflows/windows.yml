name: Windows Build

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub Release tag to upload assets to'
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container: fedora:41
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win64
            pkg_prefix: mingw64
          - arch: win32
            pkg_prefix: mingw32
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git zip gettext diffutils gh \
            libpng-devel libjpeg-turbo-devel \
            ${{ matrix.pkg_prefix }}-gcc \
            ${{ matrix.pkg_prefix }}-gcc-c++ \
            ${{ matrix.pkg_prefix }}-binutils \
            ${{ matrix.pkg_prefix }}-filesystem \
            ${{ matrix.pkg_prefix }}-SDL2 \
            ${{ matrix.pkg_prefix }}-SDL2_ttf \
            ${{ matrix.pkg_prefix }}-libpng \
            ${{ matrix.pkg_prefix }}-libjpeg-turbo \
            ${{ matrix.pkg_prefix }}-libvorbis \
            ${{ matrix.pkg_prefix }}-curl \
            ${{ matrix.pkg_prefix }}-gettext

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Package Neverball (.zip)
        run: |
          ./scripts/package-windows.sh --arch ${{ matrix.arch }}

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: neverball-${{ matrix.arch }}
          path: build/windows/neverball-*.zip
          retention-days: 7
          archive: false

      - name: Upload ZIP to Draft Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" build/windows/neverball-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
