# Generated by Antigravity CLI 1.5.13 (Gemini 4 Hydrogen (Medium))

name: Release

on:
  push:
    tags:
      - 'neverball-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Create Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Set release metadata
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Create source archive
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${TAG#neverball-}"
          mkdir -p artifacts
          SRC_DIR="$(mktemp -d)"
          git archive --format=tar --prefix="${TAG}/" HEAD | tar -xf - -C "$SRC_DIR"
          printf '%s\n' "$VER" > "$SRC_DIR/${TAG}/neverball-version.txt"
          tar -czf "artifacts/${TAG}.tar.gz" -C "$SRC_DIR" "${TAG}"
          rm -rf "$SRC_DIR"

      - name: Create GitHub Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ARGS=(
            "$TAG"
            "artifacts/${TAG}.tar.gz"
            --repo "$GITHUB_REPOSITORY"
            --title "Neverball ${TAG#neverball-}"
            --draft
          )
          if [ -f doc/release-notes.md ]; then
            ARGS+=(--notes-file doc/release-notes.md)
          else
            ARGS+=(--notes "")
          fi
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*)
              ARGS+=(--prerelease)
              ;;
          esac
          gh release create "${ARGS[@]}"

  macos:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/macos.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  windows:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  checksums:
    name: Update Release Checksums
    needs: [prepare, macos, windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts

      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "${{ needs.prepare.outputs.tag }}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
