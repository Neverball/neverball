# Generated by Antigravity CLI 1.5.13 (Gemini 4 Hydrogen (Medium))

name: Release

on:
  push:
    tags:
      - 'neverball-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/macos.yml

  windows:
    uses: ./.github/workflows/windows.yml

  release:
    name: Create Draft Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create source archive
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          git archive --format=tar.gz --prefix="${TAG}/" --output="artifacts/${TAG}.tar.gz" HEAD

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ARGS=(
            "$TAG"
            artifacts/*
            --repo "$GITHUB_REPOSITORY"
            --title "Neverball ${TAG#neverball-}"
            --notes-file doc/release-notes.md
            --draft
          )
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*)
              ARGS+=(--prerelease)
              ;;
          esac
          gh release create "${ARGS[@]}"
