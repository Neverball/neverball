# Generated by Antigravity CLI 1.5.13 (Gemini 4 Hydrogen (Medium))

name: Release

on:
  push:
    tags:
      - 'neverball-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Create Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Set release metadata
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            neverball-[0-9][0-9][0-9][0-9].*)
              if ! printf '%s\n' "$TAG" | grep -Eq '^neverball-[0-9]{4}\.[1-9][0-9]*(-(alpha|beta|rc)\.[1-9][0-9]*)?$'; then
                echo "Error: tag '$TAG' does not match neverball-YYYY.<increment>[-(alpha|beta|rc).N]" >&2
                exit 1
              fi
              ;;
            *)
              echo "Error: tag '$TAG' must start with neverball-YYYY." >&2
              exit 1
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Create source archive
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${TAG#neverball-}"
          mkdir -p artifacts
          SRC_DIR="$(mktemp -d)"
          git archive --format=tar --prefix="${TAG}/" HEAD | tar -xf - -C "$SRC_DIR"
          printf '%s\n' "$VER" > "$SRC_DIR/${TAG}/neverball-version.txt"
          tar -czf "artifacts/${TAG}.tar.gz" -C "$SRC_DIR" "${TAG}"
          rm -rf "$SRC_DIR"

      - name: Create GitHub Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ARGS=(
            "$TAG"
            "artifacts/${TAG}.tar.gz"
            --repo "$GITHUB_REPOSITORY"
            --title "Neverball ${TAG#neverball-}"
            --draft
          )
          if [ -f doc/release-notes.md ]; then
            ARGS+=(--notes-file doc/release-notes.md)
          else
            ARGS+=(--notes "")
          fi
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*)
              ARGS+=(--prerelease)
              ;;
          esac
          gh release create "${ARGS[@]}"

  macos:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/macos.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  windows:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
