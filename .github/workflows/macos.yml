name: macOS Build

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub Release tag to upload assets to'
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS Application (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install dependencies
        run: |
          brew install libpng jpeg-turbo libvorbis gettext

      - name: Package Neverball (.app and .dmg)
        run: |
          ./scripts/package-macos.sh --arch ${{ matrix.arch }}

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: neverball-macos-${{ matrix.arch }}
          path: build/macos/neverball-*.dmg
          retention-days: 7
          archive: false

      - name: Upload DMG to Draft Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" build/macos/neverball-*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
