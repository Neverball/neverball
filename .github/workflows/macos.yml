name: macOS Build

on:
  push:
    tags:
      - 'neverball-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS Application (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install sdl2 sdl2_ttf libpng jpeg-turbo libvorbis gettext

      - name: Package Neverball (.app and .dmg)
        run: |
          ./scripts/package-macos.sh --arch ${{ matrix.arch }} --dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neverball-macos-${{ matrix.arch }}-dmg
          path: build/macos/*.dmg
          retention-days: 7

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neverball-macos-${{ matrix.arch }}-app
          path: build/macos/Neverball.app
          retention-days: 7
